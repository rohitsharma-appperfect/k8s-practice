
apiVersion: v1
kind: Pod
metadata:
  name: init-demo-pod

spec:
  volumes:
    - name: shared-data
      emptyDir: {}

  initContainers:
    - name: init-container
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Initializing application..."
          mkdir -p /usr/share/nginx/html
          echo "Hello from Init Container!" > /usr/share/nginx/html/index.html
          echo "Initialization completed!"

      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html

  containers:
    - name: nginx-container
      image: nginx:latest

      ports:
        - containerPort: 80

      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
