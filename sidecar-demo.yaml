
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo-pod

spec:
  volumes:
    - name: shared-logs
      emptyDir: {}

  containers:
    - name: main-app
      image: busybox:1.36

      command:
        - sh
        - -c
        - |
          while true
          do
            echo "$(date): Application is running" >> /var/log/app/application.log
            sleep 5
          done

      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app

    - name: logging-sidecar
      image: busybox:1.36

      command:
        - sh
        - -c
        - |
          touch /var/log/app/application.log
          tail -f /var/log/app/application.log

      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app
